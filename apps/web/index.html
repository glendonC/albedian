<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Albedian</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3Cmask id='m'%3E%3Crect width='32' height='32' fill='white'/%3E%3Cpath d='M18.2 2.2Q18.2 13.8 29.8 13.8Q18.2 13.8 18.2 25.4Q18.2 13.8 6.6 13.8Q18.2 13.8 18.2 2.2Z' fill='black'/%3E%3C/mask%3E%3C/defs%3E%3Ccircle cx='15.2' cy='16.0' r='11.5' fill='%23FFFFFF' mask='url(%23m)'/%3E%3C/svg%3E"
    />
    <style>
      :root,
      [data-theme='dark'] {
        --alb-bg: #05070B;
        --alb-surface: rgba(11, 15, 23, 0.76);
        --alb-surface-elevated: rgba(22, 29, 42, 0.88);
        --alb-pill-bg: rgba(255, 255, 255, 0.05);
        --alb-pill-active: rgba(255, 255, 255, 0.14);
        --alb-border: rgba(255, 255, 255, 0.09);
        --alb-border-strong: rgba(255, 255, 255, 0.22);
        --alb-text: #F5F7FA;
        --alb-text-secondary: #C2C8D4;
        --alb-text-muted: #7E8798;
        --alb-accent-ice: #7CC4DF;
        --alb-accent-gold: #E5B567;
        --alb-accent-vermilion: #E86446;
        --alb-accent-lavender: #A8A2D6;
        --alb-shadow-panel: 0 20px 48px rgba(0, 0, 0, 0.55);
      }

      [data-theme='light'] {
        --alb-bg: #F4F3EF;
        --alb-surface: rgba(250, 249, 246, 0.88);
        --alb-surface-elevated: rgba(255, 255, 255, 0.96);
        --alb-pill-bg: rgba(12, 16, 24, 0.05);
        --alb-pill-active: rgba(12, 16, 24, 0.12);
        --alb-border: rgba(12, 16, 24, 0.10);
        --alb-border-strong: rgba(12, 16, 24, 0.24);
        --alb-text: #0F131A;
        --alb-text-secondary: #37404E;
        --alb-text-muted: #687282;
        --alb-accent-ice: #1D6F8A;
        --alb-accent-gold: #9E6716;
        --alb-accent-vermilion: #C94527;
        --alb-accent-lavender: #564E8A;
        --alb-shadow-panel: 0 16px 38px rgba(15, 19, 26, 0.10);
      }

      *, *::before, *::after {
        box-sizing: border-box;
      }

      html, body, #root {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: var(--alb-bg);
        color: var(--alb-text);
        font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        transition: background-color 180ms ease, color 180ms ease;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
