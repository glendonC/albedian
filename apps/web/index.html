<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="dark" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Albedian</title>
    <link rel="preload" href="/fonts/geist/Geist-wght.woff2" as="font" type="font/woff2" crossorigin />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3Cmask id='m'%3E%3Crect width='32' height='32' fill='white'/%3E%3Cpath d='M18.2 2.2Q18.2 13.8 29.8 13.8Q18.2 13.8 18.2 25.4Q18.2 13.8 6.6 13.8Q18.2 13.8 18.2 2.2Z' fill='black'/%3E%3C/mask%3E%3C/defs%3E%3Ccircle cx='15.2' cy='16.0' r='11.5' fill='%23FFFFFF' mask='url(%23m)'/%3E%3C/svg%3E"
    />
    <style>
      :root,
      [data-theme='dark'] {
        --alb-bg: #05070B;
        --alb-surface: rgba(11, 15, 23, 0.76);
        --alb-surface-elevated: rgba(22, 29, 42, 0.88);
        --alb-pill-bg: rgba(255, 255, 255, 0.05);
        --alb-pill-active: rgba(255, 255, 255, 0.14);
        --alb-border: rgba(255, 255, 255, 0.09);
        --alb-border-strong: rgba(255, 255, 255, 0.22);
        --alb-text: #F5F7FA;
        --alb-text-secondary: #C2C8D4;
        --alb-text-muted: #7E8798;
        --alb-accent-ice: #7CC4DF;
        --alb-accent-gold: #E5B567;
        --alb-accent-vermilion: #E86446;
        --alb-accent-lavender: #A8A2D6;
        --alb-shadow-panel: 0 20px 48px rgba(0, 0, 0, 0.55);
      }

      [data-theme='light'] {
        --alb-bg: #F4F3EF;
        --alb-surface: rgba(250, 249, 246, 0.88);
        --alb-surface-elevated: rgba(255, 255, 255, 0.96);
        --alb-pill-bg: rgba(12, 16, 24, 0.05);
        --alb-pill-active: rgba(12, 16, 24, 0.12);
        --alb-border: rgba(12, 16, 24, 0.10);
        --alb-border-strong: rgba(12, 16, 24, 0.24);
        --alb-text: #0F131A;
        --alb-text-secondary: #37404E;
        --alb-text-muted: #687282;
        --alb-accent-ice: #1D6F8A;
        --alb-accent-gold: #9E6716;
        --alb-accent-vermilion: #C94527;
        --alb-accent-lavender: #564E8A;
        --alb-shadow-panel: 0 16px 38px rgba(15, 19, 26, 0.10);
      }

      *, *::before, *::after {
        box-sizing: border-box;
      }

      html, body, #root {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: var(--alb-bg);
        color: var(--alb-text);
        font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        transition: background-color 180ms ease, color 180ms ease;
      }

      /* first-paint-one (UIUX-first-paint-READY.md P1 to P5; version two, ruled 22:20 on 27 Nov): the home's first frame
         stands on these rules alone, before any stylesheet of the app arrives (the plain field start brings them with
         its script). Each value is the app rule's it copies, pinned by firstPaint.test.tsx: home.css .home-screen,
         .home-hero and their narrow and short windows, look.css .look-logo with look-tokens.css, Upload's height, and
         fonts.css's Geist. The logo stays out until first-frame.js has seen Geist 600 and the home's address. */
      @font-face {
        font-family: 'Geist';
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: url('/fonts/geist/Geist-wght.woff2') format('woff2');
      }

      .first-frame {
        position: fixed;
        inset: 0;
        z-index: 40;
        overflow: hidden;
        background: #000000;
      }

      .first-frame .home-hero {
        position: absolute;
        left: 48px;
        bottom: 56px;
        z-index: 2;
        display: grid;
        gap: 36px;
        justify-items: start;
      }

      .first-frame:not([data-logo]) .home-hero {
        visibility: hidden;
      }

      .first-frame .look-logo {
        --first-frame-fs: 132px;
        display: inline-flex;
        align-items: flex-start;
        margin-left: -6px;
        color: #ffffff;
      }

      .first-frame .look-logo__word {
        font: 600 var(--first-frame-fs) / 1 'Geist', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
        letter-spacing: -0.048em;
      }

      .first-frame .look-logo__mark {
        display: block;
        flex: none;
        width: calc(var(--first-frame-fs) * 0.857);
        height: calc(var(--first-frame-fs) * 0.857);
        margin-left: calc(var(--first-frame-fs) * -0.048);
        margin-top: calc(var(--first-frame-fs) * -0.238);
      }

      .first-frame .home-row {
        height: 48px;
      }

      @media (max-width: 900px) {
        .first-frame .look-logo {
          --first-frame-fs: clamp(56px, 14.6vw, 132px);
        }
      }

      @media (max-width: 720px) {
        .first-frame .home-hero {
          left: 16px;
          right: 16px;
          bottom: 28px;
          gap: 22px;
        }

        .first-frame .look-logo {
          --first-frame-fs: 52px;
          margin-left: -2px;
        }

        .first-frame .home-row {
          height: 44px;
        }
      }

      @media (max-height: 480px) {
        .first-frame .home-hero {
          bottom: 20px;
          gap: 20px;
        }

        .first-frame .look-logo {
          --first-frame-fs: clamp(40px, 16vh, 132px);
        }
      }
    </style>
  </head>
  <body>
    <!-- first-paint-one (UIUX-first-paint-READY.md P1 to P5): the home's first frame before the script runs, its own markup
         and rules (home.css), replaced by the home's first commit; the logo waits for first-frame.js -->
    <div id="root"><div id="first-frame" class="home-screen first-frame">
      <div class="home-hero"><span class="look-logo" role="img" aria-label="Albedian"><span class="look-logo__word" aria-hidden="true">albedian</span><svg class="look-logo__mark" viewBox="0 0 32 32" fill="none" aria-hidden="true" focusable="false"><defs><mask id="look-logo-mask-first-frame"><rect width="32" height="32" fill="white"></rect><path d="M18.2 2.2Q18.2 13.8 29.8 13.8Q18.2 13.8 18.2 25.4Q18.2 13.8 6.6 13.8Q18.2 13.8 18.2 2.2Z" fill="black"></path></mask></defs><circle cx="15.2" cy="16.0" r="11.5" fill="currentColor" mask="url(#look-logo-mask-first-frame)"></circle></svg></span><div class="home-row" aria-hidden="true"></div></div>
    </div></div>
    <script src="/first-frame.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
