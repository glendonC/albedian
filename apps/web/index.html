<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Albedian — See (Beyond) the Night Sky.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
      }
      html, body, #root {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #030508;
        color: #F4F7FB;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      /* Custom precision range scrubber */
      input[type='range'].albedian-scrubber {
        -webkit-appearance: none;
        appearance: none;
        height: 4px;
        background: rgba(148, 163, 184, 0.22);
        border-radius: 999px;
        outline: none;
        cursor: pointer;
      }
      input[type='range'].albedian-scrubber::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #38BDF8;
        border: 2px solid #F8FAFC;
        box-shadow: 0 0 10px rgba(56, 189, 248, 0.75);
        cursor: pointer;
        transition: transform 0.12s ease;
      }
      input[type='range'].albedian-scrubber::-webkit-slider-thumb:hover {
        transform: scale(1.2);
      }
      /* Subtle glassmorphic scrollbars */
      ::-webkit-scrollbar {
        width: 5px;
        height: 5px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(148, 163, 184, 0.22);
        border-radius: 999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(56, 189, 248, 0.45);
      }
      .albedian-glass-panel {
        background: linear-gradient(165deg, rgba(11, 16, 27, 0.82) 0%, rgba(6, 9, 16, 0.88) 100%);
        backdrop-filter: blur(24px) saturate(170%);
        -webkit-backdrop-filter: blur(24px) saturate(170%);
        border: 1px solid rgba(148, 163, 184, 0.14);
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.62), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      }
      .albedian-glass-pill {
        background: rgba(15, 23, 38, 0.72);
        backdrop-filter: blur(16px) saturate(150%);
        -webkit-backdrop-filter: blur(16px) saturate(150%);
        border: 1px solid rgba(148, 163, 184, 0.16);
        transition: all 0.16s cubic-bezier(0.22, 1, 0.36, 1);
      }
      .albedian-glass-pill:hover {
        border-color: rgba(56, 189, 248, 0.48);
        background: rgba(22, 34, 56, 0.85);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
