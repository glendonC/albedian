<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Albedian — See (Beyond) the Night Sky.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root,
      [data-theme='dark'] {
        --alb-bg: #05070B;
        --alb-surface: rgba(11, 15, 23, 0.76);
        --alb-surface-elevated: rgba(22, 29, 42, 0.88);
        --alb-pill-bg: rgba(255, 255, 255, 0.05);
        --alb-pill-active: rgba(255, 255, 255, 0.14);
        --alb-border: rgba(255, 255, 255, 0.09);
        --alb-border-strong: rgba(255, 255, 255, 0.22);
        --alb-text: #F5F7FA;
        --alb-text-secondary: #C2C8D4;
        --alb-text-muted: #7E8798;
        --alb-accent-ice: #7CC4DF;
        --alb-accent-gold: #E5B567;
        --alb-accent-vermilion: #E86446;
        --alb-accent-lavender: #A8A2D6;
        --alb-shadow-panel: 0 20px 48px rgba(0, 0, 0, 0.55);
      }

      [data-theme='light'] {
        --alb-bg: #F4F3EF;
        --alb-surface: rgba(250, 249, 246, 0.88);
        --alb-surface-elevated: rgba(255, 255, 255, 0.96);
        --alb-pill-bg: rgba(12, 16, 24, 0.05);
        --alb-pill-active: rgba(12, 16, 24, 0.12);
        --alb-border: rgba(12, 16, 24, 0.10);
        --alb-border-strong: rgba(12, 16, 24, 0.24);
        --alb-text: #0F131A;
        --alb-text-secondary: #37404E;
        --alb-text-muted: #687282;
        --alb-accent-ice: #1D6F8A;
        --alb-accent-gold: #9E6716;
        --alb-accent-vermilion: #C94527;
        --alb-accent-lavender: #564E8A;
        --alb-shadow-panel: 0 16px 38px rgba(15, 19, 26, 0.10);
      }

      *, *::before, *::after {
        box-sizing: border-box;
      }

      html, body, #root {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: var(--alb-bg);
        color: var(--alb-text);
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        transition: background-color 180ms ease, color 180ms ease;
      }

      /* Clean timeline scrubber */
      input[type='range'].albedian-scrubber {
        -webkit-appearance: none;
        appearance: none;
        height: 3px;
        border-radius: 999px;
        background: var(--alb-border-strong);
        outline: none;
        cursor: pointer;
      }
      input[type='range'].albedian-scrubber::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: var(--alb-text);
        border: 2px solid var(--alb-accent-ice);
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
        cursor: pointer;
        transition: transform 0.14s ease;
      }
      input[type='range'].albedian-scrubber::-webkit-slider-thumb:hover {
        transform: scale(1.2);
      }

      /* Floating card surface */
      .alb-hud-panel,
      .albedian-glass-panel {
        position: relative;
        background: var(--alb-surface);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border: 1px solid var(--alb-border);
        border-radius: 12px;
        box-shadow: var(--alb-shadow-panel);
        color: var(--alb-text);
      }

      /* Segmented Pill Container */
      .alb-pill-group {
        display: inline-flex;
        align-items: center;
        gap: 2px;
        padding: 3px;
        background: var(--alb-pill-bg);
        border: 1px solid var(--alb-border);
        border-radius: 999px;
      }

      /* Clean, human-readable pill button (Never forced ALL CAPS) */
      .alb-hud-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 6px 13px;
        background: transparent;
        color: var(--alb-text-secondary);
        border: 1px solid transparent;
        border-radius: 999px;
        font-family: 'Inter', -apple-system, sans-serif;
        font-size: 12.5px;
        font-weight: 500;
        font-variant-numeric: tabular-nums;
        cursor: pointer;
        transition: background-color 140ms ease, color 140ms ease, border-color 140ms ease;
      }
      .alb-hud-btn:hover:not(:disabled) {
        background: var(--alb-pill-bg);
        color: var(--alb-text);
      }
      .alb-hud-btn:active:not(:disabled),
      .alb-hud-btn[data-active='true'] {
        background: var(--alb-pill-active);
        border-color: var(--alb-border-strong);
        color: var(--alb-text);
        font-weight: 600;
      }
      .alb-hud-btn:disabled {
        opacity: 0.42;
        cursor: not-allowed;
      }

      /* Primary CTA Button */
      .alb-hud-btn-primary {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 10px 16px;
        background: var(--alb-text);
        color: var(--alb-bg);
        border: none;
        border-radius: 10px;
        font-family: 'Inter', -apple-system, sans-serif;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: opacity 140ms ease, transform 120ms ease;
      }
      .alb-hud-btn-primary:hover:not(:disabled) {
        opacity: 0.92;
      }

      .alb-hud-keycap {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 18px;
        height: 18px;
        padding: 0 5px;
        background: var(--alb-pill-bg);
        color: var(--alb-text-muted);
        border: 1px solid var(--alb-border);
        border-radius: 4px;
        font-family: 'JetBrains Mono', monospace;
        font-size: 10px;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
