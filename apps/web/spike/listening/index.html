<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Albedian listening session renderer</title>
    <style>
      body { font: 14px/1.5 system-ui, sans-serif; margin: 24px; max-width: 760px; background: #0b0d12; color: #e8eaf0; }
      button { font: inherit; margin: 2px 0; padding: 4px 10px; }
      p { color: #a9afbf; }
    </style>
  </head>
  <body>
    <h1>Listening session renderer</h1>

    <ol id="clips"></ol>
    <script type="module" src="./main.ts"></script>
  </body>
