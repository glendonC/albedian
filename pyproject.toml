[project]
name = "albedian-services"
version = "0.1.0"
description = "Albedian Scientific Astrometry, Media Experiment Runtime, and Voice Intent Service"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "pydantic>=2.10.0",
    "numpy>=2.1.0",
    "scipy>=1.14.0",
    "pillow>=11.0.0",
    "httpx>=0.28.0",
    "python-multipart>=0.0.20",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "hypothesis>=6.120.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
