[project]
name = "albedian-services"
version = "0.1.0"
description = "Albedian Scientific Astrometry, Media Experiment Runtime, and Voice Intent Service"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "pydantic>=2.10.0",
    "numpy>=2.1.0",
    "scipy>=1.14.0",
    "pillow>=11.0.0",
    "httpx>=0.28.0",
    "python-multipart>=0.0.20",
    "anthropic>=2.4.0",
    "pyerfa>=2.0.1.5",
    "tzfpy>=2.1.2",
    "tzdata>=2026.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "hypothesis>=6.120.0",
    "pytest-timeout==2.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Every test's own time bound (pytest-timeout): a test still running at 300 s fails by name with its stack and the run
# goes on, so CI's job never runs into its 20 minute limit unnamed. 300 s is about five times the slowest test of the
# whole job in CI's own Linux on this laptop [proposed]; a test that needs longer carries @pytest.mark.timeout(n) of
# its own with the reason beside it, and the default is not raised for one test. Its two limits: the signal (SIGALRM)
# is handled between Python bytecodes, so a test held inside one long native call is not stopped until that call
# returns; and only the main thread is covered, the one pytest runs every test in.
timeout = 300
timeout_method = "signal"
